[package]
name = "bip39-utils"
version = "0.1.0"
edition = "2021"
description = "BIP39 mnemonic wordlist and conversion utilities"

[dependencies]
sha2 = { version = "0.10.8", default-features = false }
log = { version = "0.4.14", optional = true }

[features]
default = ["std"]
std = []
precursor = ["sha2/precursor"]
hosted = ["sha2/hosted"]
renode = ["sha2/renode"]
