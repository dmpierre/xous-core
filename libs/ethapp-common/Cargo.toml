[package]
name = "ethapp-common"
version = "0.1.0"
edition = "2021"
description = "Common types for Xous Ethereum App"
license = "Apache-2.0 OR MIT"

[features]
default = []
std = []

# Dependency versions enforced by Cargo.lock.
[dependencies]
# Serialization for Xous IPC
rkyv = { version = "0.8.8", default-features = false, features = ["alloc"] }

# Numeric conversions for opcodes
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }

# Serde for tests and host builds
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }

# Zeroize for secret handling
zeroize = { version = "1.7.0", features = ["zeroize_derive"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex-literal = "0.4"
