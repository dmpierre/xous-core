[package]
name = "ethapp"
version = "0.1.0"
edition = "2021"
description = "Native Ethereum signing service for Xous on Baochip-1x"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "ethapp"
path = "src/main.rs"

# Dependency versions enforced by Cargo.lock.
[dependencies]
# Xous core
xous = "0.9.70"
xous-ipc = "0.10.10"
xous-names = { package = "xous-api-names", version = "0.9.71" }
log-server = { package = "xous-api-log", version = "0.1.69" }
log = "0.4.14"

# Common types
ethapp-common = { path = "../../libs/ethapp-common" }

# Seed vault — owns BIP-39 seed bytes and the secp256k1 signing primitives.
# ethapp delegates derivation+signing rather than handling the seed locally.
bao-seed-api = { path = "../../libs/bao-seed-api" }
bao-seed-common = { path = "../../libs/bao-seed-common" }

# Serialization
rkyv = { version = "0.8.8", default-features = false, features = ["std", "alloc"] }

# Numeric conversions
num-traits = { version = "0.2.14", default-features = false }
num-derive = { version = "0.4.2", default-features = false }

# Cryptography
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "ecdh"] }
sha2 = { version = "0.10.8" }
tiny-keccak = { version = "2.0", features = ["keccak"] }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = { version = "1.7.0", features = ["zeroize_derive"] }
rand_core = "0.6.4"

# BIP32 key derivation
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }

# BIP39 mnemonic utilities
bip39-utils = { path = "../../libs/bip39-utils" }

# Hex encoding
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex-literal = "0.4"

[target.'cfg(target_os = "xous")'.dependencies]
# TRNG service for hardware randomness
trng = { path = "../trng" }
# Persistent storage (optional — not all targets have PDDB)
pddb = { path = "../pddb", optional = true }

[target.'cfg(not(target_os = "xous"))'.dependencies]
# getrandom with std feature is only used for host testing builds.
# On Xous, the TRNG service provides randomness instead.
getrandom = { version = "0.2", default-features = false, features = ["std"] }

[features]
default = []
# Enable blind signing for pre-hashed EIP-712
blind-signing = []
# Enable Eth2/BLS operations (requires BLS crate)
eth2 = []
# Development mode with ephemeral test seed (INSECURE)
dev-mode = []
# Auto-approve for testing (INSECURE)
autoapprove = []
# Board/target features (auto-injected by xtask)
bao1x = []
board-dabao = []
hosted-dabao = []
