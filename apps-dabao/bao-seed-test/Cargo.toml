[package]
name = "bao-seed-test"
version = "0.1.0"
edition = "2021"
description = "Integration test app for the bao-seed Xous service (seed vault)"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "bao-seed-test"
path = "src/main.rs"

[dependencies]
log = "0.4.14"
xous = "0.9.70"
xous-ipc = "0.10.10"
log-server = { package = "xous-api-log", version = "0.1.69" }
xous-names = { package = "xous-api-names", version = "0.9.71" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.70" }

# Bao-seed client + types
bao-seed-api = { path = "../../libs/bao-seed-api" }
bao-seed-common = { path = "../../libs/bao-seed-common" }

# Board support (needed so xtask can forward utralib/bao1x)
utralib = { version = "0.1.27", optional = true, default-features = false }

[features]
default = []
bao1x = ["utralib/bao1x"]
board-dabao = []
hosted-dabao = ["bao-seed-api/hosted-dabao"]
