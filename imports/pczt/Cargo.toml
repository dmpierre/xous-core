# NOTE (xous-core relocation): This crate is a vendored fork of librustzcash's
# `pczt` crate, relocated from `../librustzcash/pczt` into `imports/pczt` so the
# patch lives entirely inside xous-core. The 4-line firmware patch (search for
# `set_spend_auth_sig`) exposes accessors needed by
# `services/zcashapp/src/signing.rs` to bypass the clone+serialize round-trip
# that triggers RV32 heap corruption on Baochip-1x. See agent memory entry
# `zcashapp_multi_recv_corruption.md` for the full investigation.
#
# Because the upstream crate uses `workspace = true` for many fields, a
# self-contained `[workspace]` block is declared below, mirroring the relevant
# parts of librustzcash's root manifest. The presence of this `[workspace]`
# table also prevents the outer xous-core workspace from claiming this crate as
# a member.
[workspace]
members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.85.1"
repository = "https://github.com/zcash/librustzcash"
license = "MIT OR Apache-2.0"
categories = ["cryptography::cryptocurrencies"]

[workspace.dependencies]
# Intra-librustzcash dependencies are pulled from crates.io; the upstream
# workspace points these at sibling paths, but we don't have those siblings.
zcash_note_encryption = "0.4.1"
zcash_primitives = { version = "0.27", default-features = false }
zcash_protocol = { version = "0.8", default-features = false }
zcash_proofs = { version = "0.27", default-features = false }
zcash_script = { version = "0.4.3", default-features = false }
transparent = { package = "zcash_transparent", version = "0.7.0", default-features = false }

# Shielded protocols
ff = { version = "0.13", default-features = false }
incrementalmerkletree = { version = "0.8.2", default-features = false }
shardtree = "0.6.2"

# Sapling
bls12_381 = "0.8"
jubjub = "0.10"
redjubjub = { version = "0.8", default-features = false }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }

# Orchard
orchard = { version = "0.13", default-features = false }
pasta_curves = "0.5"

# Transparent
ripemd = { version = "0.1", default-features = false }
secp256k1 = { version = "0.29", default-features = false, features = ["alloc"] }

# Boilerplate & missing stdlib
getset = "0.1"
nonempty = { version = "0.11", default-features = false }

# CSPRNG
rand_core = { version = "0.6", default-features = false }

# Digests
blake2b_simd = { version = "1", default-features = false }
sha2 = { version = "0.10", default-features = false }

# Documentation
document-features = "0.2"

# Encodings
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive"] }

# ZIP 32
zip32 = { version = "0.2", default-features = false }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(zcash_unstable, values("zfuture", "nu7"))',
  'cfg(live_network_tests)',
] }

[package]
name = "pczt"
version = "0.6.0"
authors = ["Jack Grigg <jack@electriccoin.co>"]
edition.workspace = true
rust-version.workspace = true
description = "Tools for working with partially-created Zcash transactions"
homepage = "https://github.com/zcash/librustzcash"
repository.workspace = true
license.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
zcash_note_encryption = { workspace = true, optional = true }
zcash_primitives = { workspace = true, optional = true }
zcash_protocol = { workspace = true, default-features = false }

blake2b_simd = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }

# Encoding
postcard.workspace = true
serde.workspace = true
serde_with = { version = "3", default-features = false, features = ["alloc", "macros"] }

# Payment protocols
# - Transparent
secp256k1 = { workspace = true, optional = true }
transparent = { workspace = true, optional = true }
zcash_script = { workspace = true, optional = true }

# - Sapling
bls12_381 = { workspace = true, optional = true }
ff = { workspace = true, optional = true }
jubjub = { workspace = true, optional = true }
redjubjub = { workspace = true, optional = true }
sapling = { workspace = true, optional = true }

# - Orchard
nonempty = { workspace = true, optional = true }
orchard = { workspace = true, optional = true }
pasta_curves = { workspace = true, optional = true }

# Dependencies used internally:
# (Breaking upgrades to these are usually backwards-compatible, but check MSRVs.)
# - Boilerplate
getset.workspace = true

# - Documentation
document-features = { workspace = true, optional = true }

[dev-dependencies]
incrementalmerkletree.workspace = true
ripemd.workspace = true
secp256k1 = { workspace = true, features = ["rand"] }
sha2.workspace = true
shardtree.workspace = true
zcash_primitives = { workspace = true, features = [
    "test-dependencies",
    "transparent-inputs",
] }
zcash_proofs = { workspace = true, features = ["bundled-prover"] }
zip32.workspace = true

[features]
default = ["std"]
std = ["document-features"]
zip-233 = ["zcash_primitives/zip-233"]

## Enables functionality that requires Orchard protocol types.
orchard = [
    "dep:ff",
    "dep:nonempty",
    "dep:orchard",
    "dep:pasta_curves",
]

## Enables functionality that requires Sapling protocol types.
sapling = [
    "dep:bls12_381",
    "dep:ff",
    "dep:jubjub",
    "dep:redjubjub",
    "dep:sapling",
    "dep:zcash_note_encryption",
]

## Enables functionality that requires Zcash transparent protocol types.
transparent = [
  "dep:secp256k1",
  "dep:transparent",
  "dep:zcash_script",
  "transparent/transparent-inputs"
]

## Enables building a PCZT from the output of `zcash_primitives`'s `Builder::build_for_pczt`.
zcp-builder = ["dep:zcash_primitives"]

#! ### PCZT roles behind feature flags
#!
#! These roles require awareness of at least one payment protocol's types in order to
#! function.

## Enables the I/O Finalizer role.
io-finalizer = [
    "dep:blake2b_simd",
    "dep:rand_core",
    "rand_core/getrandom",
    "dep:zcash_primitives",
    "orchard",
    "sapling",
    "transparent",
]

## Enables the Prover role.
prover = [
    "dep:rand_core",
    "rand_core/getrandom",
    "orchard?/circuit",
    "sapling?/circuit",
    "sapling?/temporary-zcashd",
]

## Enables the Signer role.
signer = [
    "dep:blake2b_simd",
    "dep:rand_core",
    "rand_core/getrandom",
    "dep:zcash_primitives",
    "orchard",
    "sapling",
    "transparent",
]

## Enables the Spend Finalizer role.
spend-finalizer = ["transparent"]

## Enables the Transaction Extractor role.
tx-extractor = [
    "dep:blake2b_simd",
    "dep:rand_core",
    "rand_core/getrandom",
    "dep:zcash_primitives",
    "orchard",
    "orchard/circuit",
    "sapling",
    "sapling/circuit",
    "transparent",
]

# Undocumented internal feature flag for enabling features needed for tests.
internal-tests = [
    "io-finalizer",
    "prover",
    "signer",
    "tx-extractor",
    "zcash_script/signature-validation",
]

[[test]]
name = "end_to_end"
required-features = ["internal-tests"]

[lints]
workspace = true
